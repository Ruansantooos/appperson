<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Compras de Obra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app em "moldura" clara; nav em pílula escura; KPIs em cartões; painel escuro com lista + cartão roxo da solicitação; etapas em cartões brancos abaixo */
:root{
  --bg:#FFFFFF; --frame:#FFFFFF; --surface:#FFFFFF; --surface-2:#F3F3FA; --ink:#14141F; --muted:#6E6E84; --line:#E5E5EF;
  --accent:#5847EE; --accent-2:#8072FF; --accent-ink:#FFFFFF; --accent-soft:#ECEAFE;
  --panel:#16161F; --panel-2:#20202C; --panel-3:#2A2A38; --panel-ink:#F3F3F8; --panel-muted:#9C9CB2;
  --urgent:#E5484D; --urgent-soft:#FDECEC; --ok:#16A05A; --ok-soft:#E2F5EA; --warn:#C47A0A; --warn-soft:#FCF1DA;
  --f-display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Plus Jakarta Sans",system-ui,sans-serif;
  --r:14px; --rc:22px;
  --shadow:none;
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);margin:0;padding-inline:16px;padding-block:16px 40px}
button,input,select,textarea{font:inherit;color:inherit}
.mono,.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px}
h1,h2,h3{margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{max-width:1360px;margin:0 auto;background:var(--frame);padding:8px 12px 36px}
@media (max-width:700px){.shell{padding:4px 0 28px}}

/* Top */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent-2),var(--accent));display:grid;place-items:center;flex:0 0 auto}
.logo svg{width:22px;height:22px}
.brand b{display:block;font:800 17px/1.1 var(--f-display);letter-spacing:.01em}
.brand span span{display:block;font-size:11.5px;color:var(--muted)}
.nav{display:flex;gap:2px;background:var(--panel);padding:5px;border-radius:999px;overflow-x:auto;max-width:100%}
.nav button{border:0;background:transparent;color:var(--panel-muted);padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.nav button:hover{color:var(--panel-ink)}
.nav button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.top-r{display:flex;gap:8px;align-items:center}
@media (max-width:700px){.top-r{order:2}.nav{order:3;width:100%}}
.icobtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:0 0 auto}
.icobtn svg{width:18px;height:18px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--accent-ink);background:linear-gradient(135deg,#F5A26B,#E0607E);flex:0 0 auto}
.avatar.sm{width:34px;height:34px;font-size:12px}
.av-0{background:linear-gradient(135deg,#7C9CFF,#5847EE)} .av-1{background:linear-gradient(135deg,#F5A26B,#E0607E)} .av-2{background:linear-gradient(135deg,#4FD1A5,#2A9D8F)} .av-3{background:linear-gradient(135deg,#F7C85C,#E08A2C)}
.demo-tag{font-size:11px;font-weight:600;color:var(--muted);border:1px dashed var(--line);padding:4px 10px;border-radius:999px;white-space:nowrap}
@media (max-width:700px){.demo-tag{display:none}}

/* Page head */
.phead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.phead .t{margin-right:auto;min-width:0}
.phead h1{font:700 clamp(28px,4vw,40px)/1.05 var(--f-display);letter-spacing:-.02em}
.phead p{margin:4px 0 0;color:var(--muted)}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.lg{padding:12px 22px;font-size:14px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.dark{background:var(--panel);border-color:var(--panel);color:var(--panel-ink)}
.btn.white{background:#fff;border-color:#fff;color:#14141F}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 12px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label.f{display:grid;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;color:var(--ink);font-size:14px}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{resize:vertical;min-height:140px;line-height:1.55}
.in.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.in.pill{border-radius:999px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.urg{background:var(--urgent-soft);color:var(--urgent);border-color:transparent}
.chip.urg::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.urg i{font-style:normal}
.chip.st-nova,.chip.st-aprovado,.chip.st-pedido{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.st-cotacao,.chip.st-analise{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.st-entregue,.chip.st-finalizado{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.ai{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.sel{cursor:pointer}
.chip.sel[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);padding:18px 20px;display:grid;gap:6px;position:relative;overflow:hidden;min-height:150px;align-content:start}
.kpi .k{font-size:13px;font-weight:600;color:var(--ink)}
.kpi .v{font:700 30px/1.1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:16px;font-weight:600;color:var(--muted);margin-right:3px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi .ic{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line)}
.kpi .ic svg{width:17px;height:17px}
.kpi.u .ic{color:var(--urgent)} .kpi.a .ic{color:var(--accent)} .kpi.g .ic{color:var(--ok)}
.kpi .v.u{color:var(--urgent)} .kpi .v.g{color:var(--ok)}
.mini-bars{display:flex;align-items:flex-end;gap:7px;height:62px;margin-top:6px}
.mini-bars span{flex:1;border-radius:6px 6px 3px 3px;background:var(--accent);opacity:.9;min-height:6px;position:relative}
.mini-bars span:nth-child(even){opacity:.55}
.mini-lab{display:flex;gap:7px;font-size:10px;color:var(--muted)} .mini-lab span{flex:1;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.urg-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

/* Filters bar */
.fbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.fbar .lab{font-weight:700;font-size:13px;display:flex;gap:8px;align-items:center}
.fbar .lab i{font-style:normal;background:var(--panel);color:var(--panel-ink);border-radius:999px;font-size:11px;padding:1px 8px}
.fbar .in{flex:1 1 200px;min-width:0}
.fbar select.in{flex:0 1 240px}

/* Dark panel */
.dpanel{background:var(--panel);border-radius:28px;padding:20px;color:var(--panel-ink);display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:18px;position:relative;margin-bottom:18px}
@media (max-width:980px){.dpanel{grid-template-columns:minmax(0,1fr)}}
.dpanel-h{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dpanel-h h2{font:700 17px var(--f-display);margin-right:auto}
.notch{display:flex;gap:4px;background:var(--frame);padding:5px;border-radius:999px;overflow-x:auto;max-width:100%}
.notch button{border:0;background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:12.5px;display:flex;gap:8px;align-items:center;white-space:nowrap;border:1px solid var(--line)}
.notch button b{font-size:11px;background:var(--surface-2);border-radius:999px;padding:0 7px;min-width:20px;text-align:center}
.notch button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.notch button[aria-pressed="true"] b{background:#fff;color:var(--accent)}
.rlist{display:grid;gap:8px;max-height:560px;overflow:auto;padding-right:4px;align-content:start}
.ritem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:var(--panel-2);border:0;border-radius:18px;padding:10px 14px 10px 10px;cursor:pointer;color:var(--panel-ink)}
.ritem:hover{background:var(--panel-3)}
.ritem[aria-current="true"]{background:linear-gradient(135deg,var(--accent-2),var(--accent))}
.ritem .id{font-weight:700;font-size:13.5px;display:flex;gap:6px;align-items:center}
.ritem .sub{font-size:12px;color:var(--panel-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem[aria-current="true"] .sub{color:rgba(255,255,255,.8)}
.ritem .val{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ritem .val small{display:block;font-size:11px;font-weight:600;color:var(--panel-muted)}
.ritem[aria-current="true"] .val small{color:rgba(255,255,255,.8)}
.dot-urg{width:7px;height:7px;border-radius:50%;background:var(--urgent);display:inline-block}
.pst{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--panel-3);color:var(--panel-ink);white-space:nowrap}
.ritem[aria-current="true"] .pst{background:#fff;color:#14141F}

.hero{background:linear-gradient(140deg,#7869FF 0%,#5847EE 55%,#4A3BD6 100%);border-radius:24px;padding:22px 24px;color:#fff;display:grid;gap:18px;min-width:0;align-content:start}
.hero .lbl{font-size:12px;color:rgba(255,255,255,.75);font-weight:500}
.hero-top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.hero-top{grid-template-columns:1fr}}
.hero .code{font:700 30px/1.1 var(--f-display);letter-spacing:-.01em;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hero .gpill{font-size:11.5px;font-weight:600;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:999px}
.hero .gpill.u{background:#fff;color:var(--urgent)}
.hero .obra{font:700 17px/1.25 var(--f-display)}
.hero .who{display:flex;gap:10px;align-items:center}
.hero .who b{display:block;font-size:13.5px} .hero .who span{font-size:11.5px;color:rgba(255,255,255,.75)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px;display:grid;gap:6px;min-height:96px;align-content:space-between}
.tile .tq{font:700 20px var(--f-display);font-variant-numeric:tabular-nums}
.tile .tq small{font-size:12px;font-weight:600;opacity:.8;margin-left:3px}
.tile .d{font-size:12px;color:rgba(255,255,255,.85);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.more{background:transparent;border:1.5px dashed rgba(255,255,255,.4);place-items:center;text-align:center;align-content:center;font-size:12.5px;font-weight:600}
.hero-foot{display:flex;gap:18px 30px;align-items:flex-end;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.18);padding-top:16px}
.hero-foot .m b{display:block;font:700 18px var(--f-display);font-variant-numeric:tabular-nums}
.hero-foot .act{margin-left:auto;display:flex;gap:8px;align-items:center}
.hero .ring{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer}
.hero .ring svg{width:17px;height:17px}

/* Detail sections */
.detail{display:grid;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);padding:20px 22px;min-width:0;scroll-margin-top:16px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.panel-h h3{font:700 17px/1.2 var(--f-display);letter-spacing:-.01em}
.panel-h .step{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface-2);padding:3px 10px;border-radius:999px}
.hd{display:grid;gap:12px}
.meta{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.meta b{color:var(--ink);font-weight:600}
.stepper{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.stepper div{flex:1 0 auto;min-width:96px;font-size:11.5px;font-weight:600;color:var(--muted);padding:7px 12px;border-radius:999px;background:var(--surface-2);text-align:center;white-space:nowrap}
.stepper div.done{background:var(--ok-soft);color:var(--ok)}
.stepper div.cur{background:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;padding:3px;gap:2px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted);border-radius:999px}
.seg button[aria-pressed="true"].u{background:var(--urgent);color:#fff}
.seg button[aria-pressed="true"].n{background:var(--panel);color:var(--panel-ink)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right} td.c,th.c{text-align:center}
.cell-pick{cursor:pointer;border-radius:999px;padding:5px 10px;display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;font-variant-numeric:tabular-nums;font-weight:500}
.cell-pick:hover{border-color:var(--line)}
.cell-pick.best{color:var(--ok);font-weight:700}
.cell-pick.win{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.cell-na{color:var(--muted);font-size:12px}
tfoot td{font-weight:700;background:var(--surface-2)}

.suppick{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;max-height:330px;overflow:auto;padding:2px}
.sup{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:16px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.sup:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.sup input{margin-top:3px;accent-color:var(--accent)}
.sup .n{font-weight:600;line-height:1.25}
.sup .e{font-size:11.5px;color:var(--muted);word-break:break-all}
.mail{background:var(--surface-2);border:1px dashed var(--line);border-radius:16px;padding:14px 16px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}

.quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.q{border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:9px;background:var(--surface);align-content:start}
.q.wait{border-style:dashed;background:var(--surface-2)}
.q .qh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.q .qn{font-weight:700}
.file{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--surface-2);border:1px solid var(--line);padding:4px 10px 4px 4px;border-radius:999px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);text-decoration:none}
.file::before{content:"PDF";font-size:9.5px;font-weight:700;background:var(--urgent);color:#fff;padding:2px 6px;border-radius:999px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

.ai-box{border-radius:20px;padding:18px 20px;display:grid;gap:12px;background:linear-gradient(140deg,var(--accent-soft),var(--surface-2));border:1px solid var(--line)}
.ai-box h4{margin:0;font:700 15px var(--f-display);color:var(--accent);display:flex;gap:8px;align-items:center}
.ai-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.ai-card{background:var(--surface);border-radius:14px;padding:12px 14px;display:grid;gap:2px;border:1px solid var(--line)}
.ai-card .k{font-size:11.5px;color:var(--muted);font-weight:600}
.ai-card .v{font-weight:700}
.ai-card .x{font:700 20px var(--f-display);font-variant-numeric:tabular-nums}
.flags{display:grid;gap:5px;margin:0;padding:0;list-style:none;font-size:13px}
.flags li{display:flex;gap:8px;align-items:baseline}
.flags li::before{content:"";flex:0 0 7px;height:7px;border-radius:50%;background:var(--warn);transform:translateY(-1px)}
.flags li.good::before{background:var(--ok)}

.reasons{display:grid;gap:8px}
.reason{display:grid;grid-template-columns:minmax(140px,1.1fr) minmax(150px,1fr) minmax(160px,1.4fr);gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:16px}
@media (max-width:640px){.reason{grid-template-columns:1fr}}
.err{color:var(--urgent);font-size:12.5px;font-weight:600}
.doccard{border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.doccard .dh{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline}
.soon{border:1px dashed var(--line);border-radius:16px;padding:12px 14px;color:var(--muted);font-size:13px}
.log{list-style:none;margin:0;padding:0;display:grid}
.log li{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.log li:last-child{border-bottom:0}
.log time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(168px,1fr);gap:8px;overflow-x:auto;padding-bottom:8px;align-items:start}
.kcol{background:var(--surface-2);border-radius:20px;padding:10px;display:grid;gap:8px;align-content:start;min-height:340px}
.kcol-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;padding:4px 4px 2px}
.kcol-h b{margin-left:auto;font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.kdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.kempty{font-size:12px;color:var(--muted);text-align:center;padding:18px 6px;border:1px dashed var(--line);border-radius:14px}
.kcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:7px;cursor:pointer;color:var(--ink);font:inherit;min-width:0}
.kcard:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(88,71,238,.12)}
.kc-top{display:flex;justify-content:space-between;align-items:center;gap:6px}

/* ===================== utilidades ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const brl = v => v == null || isNaN(v) ? '—' : v.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const numBR = v => v == null ? '' : String(v).replace('.', ',');
const parseNum = s => { if (s == null || String(s).trim() === '') return null; const n = parseFloat(String(s).replace(/[R$\s]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')); return isNaN(n) ? null : n; };
const DAY = 864e5;
const now = () => new Date().toISOString();
const ago = (d, h = 9) => { const x = new Date(Date.now() - d * DAY); x.setHours(h, 15, 0, 0); return x.toISOString(); };
const ahead = d => { const x = new Date(Date.now() + d * DAY); x.setHours(12,0,0,0); return x.toISOString().slice(0,10); };
const fD = iso => iso ? new Date(iso.length === 10 ? iso + 'T12:00' : iso).toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}) : '—';
const fDT = iso => iso ? new Date(iso).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : '—';
const code = id => '#' + String(id).padStart(4, '0');

/* ===================== categorias e fornecedores ===================== */

const CAT_KEYS = [
  ['Serralheria e ferros', /tubo.*galv|galvaniz|alambrado|\btela\b|arame|vergalh|barra chata|cantoneira|metalon|perfil/i],
  ['Hidráulica', /pvc|joelho|registro|conex|caixa d.?[aá]gua|esgoto|lu[vb]a|t[eê] |sif[aã]o|ralo|hidr/i],
  ['Elétrica', /cabo|fio |disjuntor|caixa 4x|eletroduto|tomada|interruptor|quadro|l[aâ]mpada|refletor|el[eé]tr/i],
  ['Madeira', /madeira|caibro|viga|ripa|sarrafo|t[aá]bua|compensado|pontalete|pinus|eucalipto|madeirite|chapa resinada/i],
  ['Civil', /cimento|areia|brita|bloco|tijolo|argamassa|cal |concreto|graute|reboco|pedra/i],
  ['Telha trapezoidal', /telha|calha|rufo|cumeeira|parafuso autobrocante/i],

const UNITS = {'m²':'m²','m2':'m²','m³':'m³','m3':'m³','m':'m','mt':'m','mts':'m','metro':'m','metros':'m','un':'un','und':'un','unid':'un','unidade':'un','unidades':'un','pç':'pç','pc':'pç','pçs':'pç','pcs':'pç','peça':'pç','peças':'pç','pecas':'pç','br':'br','barra':'br','barras':'br','kg':'kg','kgs':'kg','sc':'sc','saco':'sc','sacos':'sc','rolo':'rl','rolos':'rl','rl':'rl','cx':'cx','caixas':'cx','l':'L','lt':'L','litro':'L','litros':'L','gl':'gl','galão':'gl','galões':'gl','lata':'lata','latas':'lata','cj':'cj','conjunto':'cj','conjuntos':'cj','jg':'jg','jogo':'jg','jogos':'jg','t':'t','ton':'t','tonelada':'t','toneladas':'t','milheiro':'mil','pct':'pct','pacote':'pct','pacotes':'pct'};
function parseItems(text) {
  return String(text || '').split(/\n|;/)
    .map(s => s.replace(/^\s*(?:[-•*·–]+|\d{1,2}[.)](?=\s))\s*/, '').trim())
    .filter(s => s.length > 1)
    .map(line => {
      let qtd = null, un = 'un', desc = line;
      const m = line.match(/^(\d+(?:[.,]\d+)?)\s*(.*)$/);
      if (m && m[2]) {
        qtd = parseFloat(m[1].replace(',', '.'));
        const rest = m[2].replace(/^x\s+/i, '');
        const um = rest.match(/^([^\s\d]+?)\.?\s+(.*)$/);
        if (um && UNITS[um[1].toLowerCase()]) { un = UNITS[um[1].toLowerCase()]; desc = um[2]; }
        else desc = rest;
        desc = desc.replace(/^(de|do|da|dos|das)\s+/i, '');
      }
      desc = desc.charAt(0).toUpperCase() + desc.slice(1);
      return {id: uid(), qtd, un, desc};
    });
}

/* ===================== análise das cotações ===================== */
function cotTotal(r, c, onlyIds) {
  let t = 0; r.itens.forEach(i => { const p = c.precos[i.id]; if (p != null && (!onlyIds || onlyIds.includes(i.id))) t += p * (i.qtd || 1); }); return t;
}
const coverage = (r, c) => r.itens.filter(i => c.precos[i.id] != null).length;
function analyze(r) {
  const cs = r.cotacoes; if (!cs.length) return null;
  const best = {}; let splitTotal = 0; const noQuote = [];
  r.itens.forEach(i => {
    let b = null; cs.forEach(c => { const p = c.precos[i.id]; if (p != null && (!b || p < b.price || (p === b.price && c.prazoDias < cot_(r, b.supId).prazoDias))) b = {supId: c.supId, price: p}; });
    if (b) { best[i.id] = b; splitTotal += b.price * (i.qtd || 1); } else noQuote.push(i);
  });
  const completos = cs.filter(c => coverage(r, c) === r.itens.length).map(c => ({supId: c.supId, total: cotTotal(r, c) + (c.frete || 0), prazo: c.prazoDias})).sort((a, b) => a.total - b.total);
  const bestSingle = completos[0] || null;
  const fastest = [...cs].sort((a, b) => a.prazoDias - b.prazoDias || coverage(r, b) - coverage(r, a))[0];
  const splitSups = [...new Set(Object.values(best).map(b => b.supId))];
  const splitFrete = splitSups.reduce((t, s) => t + (cot_(r, s).frete || 0), 0);
  const splitGross = splitTotal + splitFrete;
  let sug, sugText;
  if (bestSingle && (splitSups.length === 1 || bestSingle.total <= splitGross * 1.03)) {
    sug = Object.fromEntries(r.itens.map(i => [i.id, bestSingle.supId]));
    sugText = splitSups.length === 1 ? `Fechar tudo com ${sup_(bestSingle.supId).nome}: menor preço em todos os itens.` : bestSingle.total <= splitGross ? `Fechar tudo com ${sup_(bestSingle.supId).nome}: com o frete incluso, sai mais barato que dividir entre ${splitSups.length} fornecedores.` : `Fechar tudo com ${sup_(bestSingle.supId).nome}. Dividir entre ${splitSups.length} fornecedores economizaria só ${brl(bestSingle.total - splitGross)}, não compensa mais um pedido.`;
  } else {
    sug = Object.fromEntries(Object.entries(best).map(([k, v]) => [k, v.supId]));
    sugText = `Dividir a compra entre ${splitSups.map(s => sup_(s).nome).join(' e ')}: cada item com quem cotou mais barato.` + (bestSingle ? ` Economia de ${brl(bestSingle.total - splitGross)} contra fechar tudo com ${sup_(bestSingle.supId).nome}.` : ' Nenhum fornecedor cotou todos os itens.');
  }
  const flags = [];
  const pend = r.envios.filter(e => !cs.find(c => c.supId === e.supId));
  if (pend.length) flags.push(['', `${pend.length} fornecedor(es) ainda sem resposta: ${pend.map(e => sup_(e.supId).nome).join(', ')}.`]);
  const parc = cs.filter(c => coverage(r, c) < r.itens.length);
  if (parc.length) flags.push(['', parc.length <= 3 ? parc.map(c => `${sup_(c.supId).nome} cotou ${coverage(r, c)} de ${r.itens.length} itens.`).join(' ') : `${parc.length} fornecedores não cotaram todos os itens: ${parc.map(c => sup_(c.supId).nome).join(', ')}.`]);
  noQuote.forEach(i => flags.push(['', `Ninguém cotou: ${i.desc}.`]));
  if (r.prazoIdeal) { const lim = Math.ceil((new Date(r.prazoIdeal + 'T12:00') - Date.now()) / DAY); const late = cs.filter(c => c.prazoDias > lim && lim >= 0); if (late.length) flags.push(['', late.length <= 2 ? late.map(c => `${sup_(c.supId).nome} entrega em ${c.prazoDias} dia(s), depois do prazo ideal da obra (${fD(r.prazoIdeal)}).`).join(' ') : `${late.length} fornecedores entregam depois do prazo ideal da obra (${fD(r.prazoIdeal)}): ${late.map(c => sup_(c.supId).nome).join(', ')}.`]); }
  if (!noQuote.length && !pend.length) flags.push(['good', 'Todos os itens têm pelo menos um orçamento.']);
  const sugTotal = r.itens.reduce((t, i) => t + (sug[i.id] && cot_(r, sug[i.id]).precos[i.id] != null ? cot_(r, sug[i.id]).precos[i.id] * (i.qtd || 1) : 0), 0);
  return {best, splitTotal: splitGross, completos, bestSingle, fastest, sug, sugText, sugTotal, flags, noQuote};
}
const cot_ = (r, supId) => r.cotacoes.find(c => c.supId === supId) || {precos: {}, prazoDias: 99};
function winners(r) { const m = {}; r.itens.forEach(i => { const s = r.vencedor[i.id]; if (s) (m[s] = m[s] || []).push(i.id); }); return m; }
function winTotal(r, supId) { const ids = winners(r)[supId] || []; const c = cot_(r, supId); return cotTotal(r, c, ids) + (ids.length ? (c.frete || 0) : 0); }
function autoReason(r, supId) {
  const c = r.cotacoes.find(x => x.supId === supId);
  if (!c) return 'Não respondeu';
  if (coverage(r, c) < r.itens.length) {
    const cheaper = r.itens.some(i => c.precos[i.id] != null && r.vencedor[i.id] && c.precos[i.id] < cot_(r, r.vencedor[i.id]).precos[i.id]);
    if (!cheaper) return 'Não cotou todos os itens';
  }
  const fastestWinner = Math.min(...Object.keys(winners(r)).map(s => cot_(r, s).prazoDias));
  const priceWorse = r.itens.some(i => c.precos[i.id] != null && r.vencedor[i.id] && c.precos[i.id] > cot_(r, r.vencedor[i.id]).precos[i.id]);
  if (priceWorse) return 'Preço maior';
  if (c.prazoDias > fastestWinner) return 'Prazo de entrega';
  return 'Outro';
}

/* ---------- Gerente ---------- */
function reqTotal(r) { return r.aprovadoEm ? Object.keys(winners(r)).reduce((a, s) => a + winTotal(r, s), 0) : 0; }
function reqEcon(r) { let e = 0; if (!r.aprovadoEm) return 0; r.itens.forEach(i => { const ps = r.cotacoes.map(c => c.precos[i.id]).filter(p => p != null); const w = r.vencedor[i.id]; if (ps.length > 1 && w) e += (Math.max(...ps) - cot_(r, w).precos[i.id]) * (i.qtd || 1); }); return e; }
function obraSummary(o, reqs) {
  const rs = reqs.filter(r => r.obra === o.nome);
  const prox = rs.filter(r => r.status === 'pedido').map(r => Math.max(...Object.keys(winners(r)).map(s => new Date(addDays(r.aprovadoEm, cot_(r, s).prazoDias)).getTime()))).sort()[0];
  return {o, rs, open: rs.filter(r => stIdx(r.status) < 5), urg: rs.filter(r => r.urgente && r.status !== 'finalizado'), waitQ: rs.filter(r => ['nova', 'cotacao', 'analise'].includes(r.status)), road: rs.filter(r => r.status === 'pedido'), done: rs.filter(r => r.entrega), spent: rs.reduce((t, r) => t + reqTotal(r), 0), econ: rs.reduce((t, r) => t + reqEcon(r), 0), prox};
}

  const obras = visObras().filter(o => !f.dobra || o.nome === f.dobra).map(o => obraSummary(o, reqs));
  const ativas = obras.filter(x => x.open.length);
  const spent = reqs.reduce((t, r) => t + reqTotal(r), 0);
  const maxO = Math.max(1, ...obras.map(x => x.spent));
  const times = reqs.map(r => { const d = r.docs.find(x => x.tipo === 'Pedido de compra'); return d ? {id: r.id, t: (new Date(d.em) - new Date(r.criado)) / DAY} : null; }).filter(Boolean).sort((a, b) => a.id - b.id);
  const avg = times.length ? times.reduce((a, b) => a + b.t, 0) / times.length : null;
  const maxT = Math.max(1, ...times.map(x => x.t));
  const pts = times.map((x, i) => [times.length === 1 ? 110 : 10 + i * (200 / (times.length - 1)), 70 - x.t / maxT * 55]);
  const recv = myMail().filter(m => m.folder === 'entrada').length, sent = reqs.reduce((t, r) => t + r.envios.length, 0), peds = myMail().filter(m => m.tipo === 'pedido').length, orcs = myMail().filter(m => m.tipo === 'orcamento').length;
  const nt = f.dnotch || 'todas';
  const shown = obras.filter(x => nt === 'todas' || (nt === 'urg' && x.urg.length) || (nt === 'road' && x.road.length));
  const selO = shown.find(x => x.o.nome === f.dsel) || shown[0];
  const tally = {}; reqs.forEach(r => Object.values(r.motivos).forEach(m => m.motivo && (tally[m.motivo] = (tally[m.motivo] || 0) + 1)));
  const maxTa = Math.max(1, ...Object.values(tally));
  const money = v => `<small>R$</small>${v.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
  const short = n => n.replace(/^(EE |Residencial )/, '').split(' ').slice(0, 2).join(' ');

    <div class="rlist">${shown.map(x => `<button class="ritem" data-act="dsel" data-v="${esc(x.o.nome)}" aria-current="${selO && x.o.nome === selO.o.nome}">
        <span class="avatar sm ${avCls(obraResp(x.o.nome))}">${initials(obraResp(x.o.nome))}</span>
        <span style="min-width:0"><span class="id" style="font-size:13px">${esc(x.o.nome)}</span><span class="sub" style="display:block">${x.open.length} em andamento · ${x.road.length} a caminho</span></span>
        <span class="val">${brl(x.spent).replace(/,\d\d$/, '')}<small>${x.urg.length ? '<span style="color:#FF8A8D">urgente</span>' : 'comprado'}</small></span>
      </button>`).join('') || '<div class="empty">Nenhuma obra com esse filtro.</div>'}</div>
    ${selO ? `<div class="hero">

        <div><div class="lbl">Endereço de entrega</div><div class="small" style="font-weight:600">${esc(selO.o.end)}</div></div>

      </div>

/* ===================== ações ===================== */
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600); }
let pendingFile = null;
function pickFile(cb) { pendingFile = cb; const fp = $('#filepick'); fp.value = ''; fp.click(); }
$('#filepick').addEventListener('change', e => { const f = e.target.files[0]; if (f && pendingFile) { FILES[f.name] = URL.createObjectURL(f); pendingFile(f.name); } pendingFile = null; });
function syncStatus(r) {
  if (r.status === 'nova' && r.envios.length) r.status = 'cotacao';
  if (r.status === 'cotacao' && r.envios.length && r.envios.every(e => r.cotacoes.find(c => c.supId === e.supId))) { r.status = 'analise'; log(r, 'Todos os orçamentos recebidos'); }
}

    syncStatus(r); S.ui.pickFor = null; S.ui.dtab = 'orcamentos'; render(); toast(`Pedido de cotação enviado para ${picks.length} fornecedor(es)`);
  },
  'open-mail': el => { const m = S.mail.find(x => x.tipo === 'pedido' && x.reqId === +el.dataset.id); S.tab = 'email'; S.ui.mfold = 'pedido'; S.ui.msel = m?.id; render(); window.scrollTo(0, 0); },
  mfold: el => { S.ui.mfold = el.dataset.v; S.ui.msel = null; render(); },
  msel: el => { S.ui.msel = el.dataset.v; render(); },
  'sel-tab': el => { S.selId = +el.dataset.id; S.ui.dtab = el.dataset.v; S.role = 'compras'; S.tab = 'solicitacoes'; S.view = 'detail'; render(); window.scrollTo(0, 0); },
  'mail-quote': el => { S.selId = +el.dataset.id; S.ui.dtab = 'cotacao'; S.role = 'compras'; S.tab = 'solicitacoes'; S.view = 'detail'; render(); window.scrollTo(0, 0); },
  'mail-make': el => { const m = S.mail.find(x => x.id === el.dataset.v); const r = reqFromMail(m); render(); toast(`Solicitação ${code(r.id)} criada no quadro`); },
  'mail-sync': () => {
    let novos = 0, ped = 0, orc = 0;
    if (!S.synced && S.me === 'leticia') {
      const m = PEND_MAIL(); m.owner = 'leticia'; S.mail.push(m); novos++;
      if (isPedidoMail(m)) { reqFromMail(m); ped++; } 
    }
    visReqs().filter(r => (r.status === 'cotacao' || r.status === 'analise') && access(r).perms.has('cotar')).forEach(r => {
      const pend = r.envios.filter(e => !r.cotacoes.find(c => c.supId === e.supId)).slice(0, 1);
      pend.forEach(e => { const q = simulateQuote(r, e.supId); r.cotacoes.push(q); log(r, `Orçamento recebido por e-mail: ${sup_(e.supId).nome} (lido por IA)`); syncStatus(r); const sp = sup_(e.supId);
        S.mail.push({id: 'm' + uid(), owner: r.compradora, folder: 'entrada', to: USERS[r.compradora].email, lido: false, em: now(), tipo: 'orcamento', reqId: r.id, supId: e.supId, from: sp.nome, fromEmail: sp.email.split(';')[0].trim(), subj: `RE: ${r.urgente ? '[URGENTE] ' : ''}Cotação ${code(r.id)} – Obra ${r.obra}`, anexos: [q.arquivo], body: `Letícia, boa tarde.\n\nSegue orçamento em anexo. Prazo: ${q.prazoDias === 0 ? 'imediato' : q.prazoDias + ' dia(s)'}. Pagamento: ${q.pagamento}\n\nAtenciosamente,\n${sp.contato || sp.nome}`}); novos++; orc++; });
    });
    S.synced++; S.ui.mfold = 'entrada'; S.ui.msel = null; render();
    toast(novos ? [`${novos} e-mail${novos > 1 ? 's' : ''} novo${novos > 1 ? 's' : ''}`, ped ? `${ped} pedido de material foi para o quadro` : '', orc ? `${orc} orçamento anexado` : ''].filter(Boolean).join(' · ') : 'Nenhum e-mail novo');
  },
  'pick-all': () => { const r = req_(S.selId); const cats = S.ui.cats && S.ui.catsFor === r.id ? S.ui.cats : guessCats(r.itens); S.ui.pick = S.sups.filter(s => (!cats.length || cats.includes(s.cat)) && !r.envios.some(e => e.supId === s.id)).map(s => s.id); S.ui.pickFor = r.id; render(); },
  'pick-none': () => { S.ui.pick = []; S.ui.pickFor = req_(S.selId).id; render(); },
  'copy-mail': () => { const {subj, body} = mailText(req_(S.selId)); const t = `Assunto: ${subj}\n\n${body}`; navigator.clipboard?.writeText(t).then(() => toast('Texto copiado'), () => toast('Não deu para copiar. Selecione o texto do e-mail.')); },
  pull: () => {
    const r = req_(S.selId); const pend = r.envios.filter(e => !r.cotacoes.find(c => c.supId === e.supId));
    const take = pend.length > 3 ? pend.filter((e, k) => k % 3 !== 2) : pend.length > 1 ? pend.slice(0, pend.length - 1) : pend;
    take.forEach(e => { r.cotacoes.push(simulateQuote(r, e.supId)); log(r, `Orçamento recebido: ${sup_(e.supId).nome} (lido por IA)`); });
    syncStatus(r); render(); toast(`${take.length} orçamento(s) encontrado(s) no Outlook e lidos`);
  },
  'reply-open': el => { S.ui.reply = el.dataset.sup; S.ui.replyTxt = ''; S.ui.replyFile = null; render(); },
  'reply-close': () => { S.ui.reply = null; render(); },
  'reply-file': () => { S.ui.replyTxt = $('#reply-txt')?.value || ''; pickFile(name => { S.ui.replyFile = name; render(); }); },
  'reply-save': el => {
    const r = req_(S.selId); const s = el.dataset.sup; const txt = ($('#reply-txt')?.value || '').trim(); const sp = sup_(s);
    if (!txt && !S.ui.replyFile) { toast('Cole o texto da resposta ou anexe o orçamento'); return; }
    const q = simulateQuote(r, s, {full: true}); q.arquivo = S.ui.replyFile || null;
    const pz = txt.match(/(\d+)\s*dias?/i); if (/imediat/i.test(txt)) q.prazoDias = 0; else if (pz) q.prazoDias = +pz[1];
    const pg = txt.match(/\d+\s*DDL/i) || txt.match(/\d+\/\d+(\/\d+)?/) || txt.match(/à vista/i) || txt.match(/pagamento[^.\n]*?(\d+\s*dias)/i); if (pg) q.pagamento = pg[1] || pg[0];
    const pzE = txt.match(/(entrega|prazo)[^.\n]*?(\d+)\s*dias?/i); if (pzE) q.prazoDias = +pzE[2];
    r.cotacoes.push(q);
    S.mail.push({id: 'm' + uid(), owner: r.compradora, folder: 'entrada', to: USERS[r.compradora].email, lido: true, em: now(), tipo: 'orcamento', reqId: r.id, supId: s, from: sp.nome, fromEmail: sp.email.split(';')[0].trim(), subj: `RE: Cotação ${code(r.id)} – Obra ${r.obra}`, anexos: S.ui.replyFile ? [S.ui.replyFile] : [], body: txt || '(orçamento anexado)'});
    log(r, `Resposta de ${sp.nome} registrada manualmente; valores lidos pela IA`); syncStatus(r);
    S.ui.reply = null; S.ui.replyFile = null; S.ui.qedit = s; render(); toast('Resposta registrada. Confira os valores lidos.');
  },
  mopen: el => { S.ui.mopen = S.ui.mopen === el.dataset.v ? null : el.dataset.v; render(); },
  'open-mail-id': el => { const m = S.mail.find(x => x.id === el.dataset.v); S.role = 'compras'; S.tab = 'email'; S.ui.mfold = m.folder === 'enviados' ? 'enviados' : (m.tipo || 'entrada'); S.ui.msel = m.id; render(); window.scrollTo(0, 0); },
  'ol-connect': () => { const e = ($('#ol-email')?.value || '').trim() || me().email; S.outlook = S.outlook || {}; S.outlook[S.me] = {on: true, email: e, em: now()}; render(); toast(`Conta ${e} conectada · ${myMail().filter(m => m.folder === 'entrada').length} e-mails importados`); },
  'ol-disconnect': () => { S.outlook[S.me] = {on: false, email: ''}; render(); toast('Conta do Outlook desconectada'); },
  'attach-quote': el => { const r = req_(S.selId); const s = el.dataset.sup; pickFile(name => { const q = simulateQuote(r, s); q.arquivo = name; r.cotacoes.push(q); log(r, `Orçamento anexado: ${sup_(s).nome} (${name})`); syncStatus(r); S.ui.qedit = s; render(); toast('Orçamento anexado. Confira os valores lidos.'); }); },
  qedit: el => { S.ui.qedit = S.ui.qedit === el.dataset.sup ? null : el.dataset.sup; render(); },
  'apply-sug': () => { const r = req_(S.selId); const a = analyze(r); r.vencedor = {...a.sug}; fillReasons(r); render(); toast('Sugestão aplicada'); },
  'pick-win': el => { const r = req_(S.selId); const id = el.dataset.id; r.vencedor[id] = r.vencedor[id] === el.dataset.sup ? undefined : el.dataset.sup; if (!r.vencedor[id]) delete r.vencedor[id]; fillReasons(r); render(); },
  approve: () => {
    const r = req_(S.selId); const ws = Object.keys(winners(r));
    const losers = r.envios.map(e => e.supId).filter(s => !ws.includes(s));
    const missing = r.itens.filter(i => !r.vencedor[i.id]);
    if (missing.length || losers.some(s => !r.motivos[s]?.motivo)) { S.ui.dtab = missing.length ? 'ia' : 'motivos'; render(); toast(missing.length ? 'Falta escolher fornecedor para algum item' : 'Falta preencher algum motivo'); return; }
    Object.keys(r.motivos).forEach(s => { if (ws.includes(s)) delete r.motivos[s]; });
    r.status = 'aprovado'; r.aprovadoEm = now(); r.aprovadoPor = actorTag(r); S.ui.decErr = null; S.ui.dtab = 'pedido';
    log(r, `Compra aprovada (${ws.length} fornecedor${ws.length > 1 ? 'es' : ''})`); render(); toast('Compra aprovada. Agora é só anexar o pedido.');
  },
  'attach-po': el => {
    const r = req_(S.selId); const s = el.dataset.sup; const num = ($('#pn-' + s)?.value || '').trim() || String(S.seq++).padStart(5, '0');
    pickFile(name => {
      r.docs.push({id: uid(), tipo: 'Pedido de compra', supId: s, numero: num, valor: winTotal(r, s), arquivo: name, em: now()});
      log(r, `Pedido ${num} anexado (${sup_(s).nome})`);
      const all = Object.keys(winners(r)).every(x => r.docs.some(d => d.supId === x && d.tipo === 'Pedido de compra'));
      if (all && r.status === 'aprovado') { r.status = 'pedido'; log(r, 'Aguardando entrega na obra'); }
      render(); toast('Pedido anexado');
    });
  },
  archive: () => { const r = req_(S.selId); r.status = 'finalizado'; r.fechadoPor = actorTag(r); S.ui.dtab = 'historico'; log(r, 'Enviado ao financeiro e arquivado'); render(); toast('Arquivado'); },
  'e-urg': el => { S.ui.draft = {...readDraft(), urg: el.dataset.v === '1'}; render(); },
  'e-open': el => { S.ui.eopen = +el.dataset.id; render(); },
  pobra: el => { S.ui.pobra = el.dataset.v; S.ui.etab = null; S.ui.eopen = null; S.ui.draft = {}; render(); },
  'copy-obra': () => { const t = obraLink(S.ui.pobra); navigator.clipboard?.writeText(t).then(() => toast('Link copiado (exemplo): ' + t), () => toast(t)); },
  etab: el => { S.ui.etab = el.dataset.v; S.ui.eopen = null; render(); window.scrollTo(0, 0); },
  'e-comp': el => { S.ui.ecomp = el.dataset.v === '1'; const o = $('#e-cobs')?.value; render(); if (o) $('#e-cobs').value = o; },
  'e-confirm': el => {
    const r = req_(el.dataset.id); const ff = $('#e-foto')?.files?.[0];
    if (ff) FILES[ff.name] = URL.createObjectURL(ff);
    r.entrega = {em: now(), por: me().nome, completo: el.dataset.full === '1', obs: $('#e-cobs')?.value || '', foto: ff?.name};
    r.status = 'entregue'; log(r, `Chegada confirmada na obra${r.entrega.completo ? '' : ' (parcial)'}`);
    S.ui.eopen = null; S.ui.etab = 'entregas'; render(); toast('Chegada confirmada. Compras já foi avisada.');
  },
};
function currentPicks(r) {
  if (S.ui.pickFor === r.id) return S.ui.pick;
  const cats = S.ui.cats && S.ui.catsFor === r.id ? S.ui.cats : guessCats(r.itens);
  return S.sups.filter(s => (!cats.length || cats.includes(s.cat)) && !r.envios.some(e => e.supId === s.id)).map(s => s.id);
}
function fillReasons(r) {
  const ws = Object.keys(winners(r)); if (!ws.length) return;
  r.envios.map(e => e.supId).filter(s => !ws.includes(s)).forEach(s => { if (!r.motivos[s]?.manual) r.motivos[s] = {motivo: autoReason(r, s), obs: r.motivos[s]?.obs || '', auto: true}; });
}
function readDraft() { return {obra: $('#e-obra')?.value || '', itens: $('#e-itens')?.value || '', prazo: $('#e-prazo')?.value || '', obs: $('#e-obs')?.value || '', urg: S.ui.draft?.urg}; }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'A') return;
  e.preventDefault();
  const need = PERM_ACT[el.dataset.act];
  if (need && S.role === 'compras' && S.view === 'detail') { const r = req_(S.selId); if (r && !access(r).perms?.has(need)) { toast(denyMsg(r, need)); return; } }
  ACT[el.dataset.act]?.(el, e);
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-act][role="button"]')) { e.preventDefault(); ACT[e.target.dataset.act]?.(e.target); } });
document.addEventListener('input', e => {
  if (e.target.id === 'e-itens') updPreview();
  if (e.target.id === 'q') { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener('change', e => {
  const el = e.target; const k = el.dataset.chg; if (!k) return;
  const r = req_(S.selId);
  if (PERM_CHG[k] && r && !access(r).perms?.has(PERM_CHG[k])) { toast(denyMsg(r, PERM_CHG[k])); render(); return; }
  const it = id => r.itens.find(i => i.id === id);
  switch (k) {
    case 'eng': S.eng = el.value; S.ui.eopen = null; render(); break;
    case 'whoami': S.me = el.value; S.view = 'board'; S.ui = {}; S.tab = 'solicitacoes'; S.role = ['engenheiro', 'assistente'].includes(USERS[S.me].papel) ? 'engenheiro' : 'gerente'; render(); window.scrollTo(0, 0); toast('Entrou como ' + USERS[S.me].nome + ' · ' + PAPEL[USERS[S.me].papel]); break;
    case 'it-qtd': it(el.dataset.id).qtd = parseNum(el.value); render(); break;
    case 'it-un': it(el.dataset.id).un = el.value; save(); break;
    case 'it-desc': it(el.dataset.id).desc = el.value; save(); break;
    case 'pick': { const cur = currentPicks(r); const id = el.dataset.id; S.ui.pick = el.checked ? [...new Set([...cur, id])] : cur.filter(x => x !== id); S.ui.pickFor = r.id; render(); break; }
    case 'price': { const c = cot_(r, el.dataset.sup); c.precos[el.dataset.id] = parseNum(el.value); c.ia = false; render(); break; }
    case 'qf': { const c = cot_(r, el.dataset.sup); const kk = el.dataset.k; c[kk] = kk === 'pagamento' ? el.value : (parseNum(el.value) || 0); render(); break; }
    case 'motivo': r.motivos[el.dataset.sup] = {...(r.motivos[el.dataset.sup] || {}), motivo: el.value, manual: true}; render(); break;
    case 'motivo-obs': r.motivos[el.dataset.sup] = {...(r.motivos[el.dataset.sup] || {}), obs: el.value, manual: true}; save(); break;
    case 'gobra': S.ui.gobra = el.value; render(); break;
    case 'fobra': S.ui.fobra = el.value; render(); break;
    case 'dobra': S.ui.dobra = el.value; S.ui.dsel = el.value || null; render(); break;
    case 'dfrom': S.ui.dfrom = el.value; render(); break;
    case 'dto': S.ui.dto = el.value; render(); break;
    case 'dq': S.ui.dq = el.value; render(); break;
    case 'mtag': { const m = S.mail.find(x => x.id === el.dataset.id); m.tipo = el.value || 'outro'; if (m.tipo === 'outro') m.reqId = m.reqId; render(); toast('Etiqueta atualizada no Outlook'); break; }
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'eng-form') {
    const d = readDraft(); const itens = parseItems(d.itens);
    if (!d.obra.trim() || !itens.length) { toast('Preencha a obra e pelo menos um item'); return; }
    if (!obra_(d.obra.trim())) S.obras.push({nome: d.obra.trim(), resp: me().nome, compradora: 'leticia', end: 'Endereço a cadastrar'});
    const id = Math.max(...S.reqs.map(r => r.id)) + 1;
    const sol = ['engenheiro', 'assistente'].includes(me().papel) ? me() : USERS[uidByName(obraResp(d.obra.trim()))] || me();
    S.reqs.unshift({id, obra: d.obra.trim(), compradora: obraCompradora(d.obra.trim()) || 'leticia', solicitanteId: sol.id, solicitante: sol.nome, criado: now(), prazoIdeal: d.prazo, urgente: !!d.urg, status: 'nova', obs: d.obs, itens, envios: [], cotacoes: [], vencedor: {}, motivos: {}, docs: [], entrega: null, log: [[now(), `Solicitação criada por ${sol.nome}${sol.papel === 'assistente' ? ' (assistente de ' + USERS[sol.eng].nome + ')' : ''}`]]});
    S.ui.draft = {}; S.selId = id; render(); toast(`Solicitação ${code(id)} enviada para Compras`);
  }
  if (e.target.id === 'cov-form') {
    const f = e.target; const de = f.dataset.de; const byAdmin = !!f.dataset.admin;
    const para = $('#cf-para').value, ini = $('#cf-ini').value, fim = $('#cf-fim').value;
    const obras = [...f.querySelectorAll('input[name=cf-obra]:checked')].map(x => x.value);
    const perms = ['ver', ...[...f.querySelectorAll('input[name=cf-perm]:checked')].map(x => x.value).filter(x => x !== 'ver')];
    if (!obras.length) { toast('Escolha pelo menos uma obra'); return; }
    if (!ini || !fim || fim < ini) { toast('Confira o período: o fim precisa ser depois do início'); return; }
    const c = {id: 'c' + uid(), de, para, inicio: ini, fim, obras, perms, ativadoPor: S.me, criadoEm: now(), status: byAdmin ? 'ativa' : 'pendente', visto: false};
    if (byAdmin) { c.aceitoPor = 'Dispensado (ativada pelo gerente)'; c.aceitoEm = now(); }
    S.coberturas.push(c); S.ui.cform = false; S.ui.cformDe = null; render(); window.scrollTo(0, 0);
    toast(byAdmin ? `Cobertura ativada: ${USERS[para].nome} cobre ${USERS[de].nome} de ${fD(ini)} a ${fD(fim)}` : `${USERS[para].nome} recebeu a notificação e precisa aceitar`);
    return;
  }
  if (e.target.id === 'sup-form') {
    const nome = $('#ns-nome').value.trim(), email = $('#ns-email').value.trim();
    if (!nome || !email) return;
    S.sups.push({id: 's' + uid(), nome, cat: $('#ns-cat').value, contato: $('#ns-contato').value, email, fone: $('#ns-fone').value});
    render(); toast(`${nome} cadastrado`);
  }
});
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.kcard'); if (!c) return; dragId = +c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(dragId)); });
document.addEventListener('dragend', () => { document.querySelectorAll('.dragging,.over').forEach(x => x.classList.remove('dragging', 'over')); dragId = null; });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('.kcol'); if (!col || dragId == null) return; e.preventDefault(); document.querySelectorAll('.kcol.over').forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over'); });
document.addEventListener('drop', e => { const col = e.target.closest && e.target.closest('.kcol'); if (!col || dragId == null) return; e.preventDefault(); const id = dragId; dragId = null; moveReq(id, col.dataset.col); });
function moveReq(id, st) {
  const r = req_(id); if (!r || r.status === st) return;
  if (!access(r).perms?.has('editar') || r.status === 'finalizado' || (access(r).via === 'cob' && stIdx(st) >= 3)) { toast(denyMsg(r, 'editar')); return; }
  const from = stName(r.status); r.status = st;
  if (stIdx(st) >= 3 && !r.aprovadoEm) { r.aprovadoEm = now(); r.aprovadoPor = actorTag(r); }
  log(r, `Movido no quadro de "${from}" para "${stName(st)}"`);
  render(); toast(`${code(id)} movido para ${stName(st)}`);
}
render();
</script>
